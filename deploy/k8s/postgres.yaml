apiVersion: v1
kind: Service
metadata:
  name: diplomacy-postgres
  namespace: diplomacy
spec:
  clusterIP: None
  selector:
    app: diplomacy-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: diplomacy-postgres
  namespace: diplomacy
spec:
  serviceName: diplomacy-postgres
  replicas: 1
  selector:
    matchLabels:
      app: diplomacy-postgres
  template:
    metadata:
      labels:
        app: diplomacy-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:18
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: diplomacy-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: diplomacy-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: diplomacy-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: csi-rbd-sc
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi

