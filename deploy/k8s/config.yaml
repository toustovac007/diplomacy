apiVersion: v1
kind: ConfigMap
metadata:
  name: diplomacy-config
  namespace: diplomacy
data:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: diplomacy.kube.sspu-opava.cz
  FRONTEND_BASE_URL: https://diplomacy.kube.sspu-opava.cz
  DJANGO_CSRF_TRUSTED_ORIGINS: https://diplomacy.kube.sspu-opava.cz
  DJANGO_CORS_ALLOWED_ORIGINS: https://diplomacy.kube.sspu-opava.cz
  DJANGO_TRUST_X_FORWARDED_PROTO: "true"
  GOOGLE_OAUTH_REDIRECT_URI: https://diplomacy.kube.sspu-opava.cz/api/users/oauth/google/callback/
  ALLOW_MANUAL_PHASE_RESOLVE: "false"
  POSTGRES_DB: diplomacy
  POSTGRES_USER: diplomacy
  POSTGRES_HOST: diplomacy-postgres
  POSTGRES_PORT: "5432"
  EMAIL_BACKEND: django.core.mail.backends.dummy.EmailBackend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: diplomacy-nginx
  namespace: diplomacy
data:
  default.conf: |
    map $http_x_forwarded_proto $external_scheme {
        default $scheme;
        https https;
    }
    server {
        listen 80;
        server_name diplomacy.kube.sspu-opava.cz;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 10m;
        autoindex off;
        access_log off;
        error_log /dev/stderr crit;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        location ~ ^/(api|admin|static)(/|$) {
            # Both containers share the Pod's network namespace.
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_read_timeout 60s;
        }
        location /media/ {
            alias /srv/media/;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

