name: Build deployment images

on:
  push:
    branches: [master]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          COMPONENT: ${{ matrix.component }}
        run: |
          image="ghcr.io/${REPOSITORY,,}-${COMPONENT}"
          docker build --label "org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            --tag "${image}:${REVISION}" --tag "${image}:master" "${COMPONENT}"
          docker push "${image}:${REVISION}"
          docker push "${image}:master"

